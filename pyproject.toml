[project]
name = "bluealsa2sendspin"
version = "0.1.0"
description = "Bridges a BlueALSA Bluetooth A2DP sink into Music Assistant as a Sendspin source client, without PipeWire/PulseAudio."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "arthurbre" }]
dependencies = [
    "aiosendspin[source]>=9.1,<10",
    "dbus-next>=0.2.3",
]

[project.urls]
Homepage = "https://github.com/arthurbre/bluealsa2sendspin"

[project.scripts]
bluealsa2sendspin = "bluealsa2sendspin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluealsa2sendspin"]

[tool.ruff]
line-length = 100
target-version = "py312"
