[project]
name = "bluealsa2sendspin"
version = "0.1.0"
description = "Bridges a BlueALSA Bluetooth A2DP sink into Music Assistant as a Sendspin source client, without PipeWire/PulseAudio."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "arthurbre" }]
dependencies = [
    # Narrow upper bound: bluealsa2sendspin reaches into SendspinClient's private
    # ``_admitted_connection`` to call ``send_source_signal()``, which 9.1.x has no
    # public wrapper for (bridge.py's ``_get_signal_connection`` guards this
    # defensively). Widen once aiosendspin exposes that publicly.
    "aiosendspin[source]>=9.1,<9.2",
    "dbus-fast>=2.0",
]

[project.urls]
Homepage = "https://github.com/arthurbre/bluealsa2sendspin"

[project.scripts]
bluealsa2sendspin = "bluealsa2sendspin.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.9",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # [server] pulls in what's needed to run a real SendspinServer in-process,
    # so tests/test_integration.py exercises the client against real protocol
    # code instead of a hand-rolled fake.
    "aiosendspin[server]>=9.1,<9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bluealsa2sendspin"]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "PIE",   # flake8-pie
    "PTH",   # flake8-use-pathlib
    "N",     # pep8-naming
    "RUF",   # ruff-specific rules
    "PERF",  # perflint
]
ignore = [
    "COM812", # conflicts with the ruff formatter
]

[tool.ruff.lint.isort]
known-first-party = ["bluealsa2sendspin"]

[tool.ruff.format]
# Force Linux/macOS line endings regardless of the checkout platform.
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["dbus_fast.*"]
ignore_missing_imports = true
